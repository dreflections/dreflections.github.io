<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reflections - Shelter</title>

  <link rel="icon" type="image/jpeg" href="Originals/logo.jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="supporters.css">
</head>
<body>

  <!--WHAT ARE YOU LOOKING FOR?!-->
  <section class="teaser">
	<form id="support-form" class="thankyou__form">
    <img src="assets\shelter.png" alt="Deltarune Reflections" class="content__image">
    </form>
  </section>

<form id="support-form" class="thankyou__form">
  <label for="codice">ENTER A PIN:</label>
  <input type="text" id="codice" placeholder="PIN">
  <p id="messaggio"></p>
</form>

<script>

  document.addEventListener('DOMContentLoaded', function() {
    
    const inputField = document.getElementById('codice');
    const messageField = document.getElementById('messaggio');
	
    <!--HEY MAN THAT'S CHEATING!-->
    const secret = "12250915199017";

    if (!inputField || !messageField) {
      console.error("Errore: ID 'codice' o 'messaggio' non trovati nel file HTML.");
      return;
    }


    inputField.addEventListener('input', function() {
      if (inputField.value === secret) {
        messageField.textContent = "Code Correct";
        messageField.style.color = "green";
      } else {
        messageField.textContent = "Invalid Code";
        messageField.style.color = "red";
      }
    });

    inputField.addEventListener('keydown', function(event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        
        if (inputField.value === secret) {
          window.location.href = "71494.html"; 
        } else {
          messageField.textContent = "Invalid Code";
          messageField.style.color = "red";
        }
      }
    });

  });
</script>

</body>
</html>
